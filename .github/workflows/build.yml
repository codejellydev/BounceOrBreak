name: Unity Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'scripts/**'

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install paid assets
        run: |
          git clone https://x-access-token:${{ secrets.PAT_ASSET }}@github.com/${{ github.repository_owner }}/BounceOrBreak-Assets.git /paid-assets
          node Scripts/install-paid-assets.js

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.9f1
          targetPlatform: Android

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-Android
          path: build/Android
          retention-days: 7