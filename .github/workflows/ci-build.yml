name: CI / Build (Android)

on:
  push:
    branches:
      - main
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'

  workflow_dispatch:
    
jobs:
  build:
    name: Build (Android)
    runs-on: ubuntu-latest
    # 태그 푸시용
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install paid assets
        run: |
          git clone https://x-access-token:${{ secrets.PAT_ASSET }}@github.com/${{ github.repository_owner }}/BounceOrBreak-Assets.git $HOME/paid-assets
          node Tools/install-paid-assets.js

      - name: Resolve version
        id: version
        run: |
          base="$(sed -n 's/^  bundleVersion: //p' ProjectSettings/ProjectSettings.asset | tr -d '\r')"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            version="$base"
            # 같은 버전이 다른 커밋에 있으면 bundleVersion을 안 올린 것이므로 실패
            tagged="$(git ls-remote --tags origin "refs/tags/v$version" | cut -f1)"
            if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::v$version is already tagged at $tagged. Bump bundleVersion before merging to main."
              exit 1
            fi
            echo "create_tag=$([ -z "$tagged" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            version="$base-dev.$GITHUB_RUN_NUMBER+${GITHUB_SHA::7}"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build Unity project
        uses: game-ci/unity-builder@v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.9f1
          targetPlatform: Android
          androidTargetSdkVersion: AndroidApiLevel36
          androidExportType: androidAppBundle
          androidVersionCode: ${{ github.run_number }}
          androidKeystoreName: bounceorbreak.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          versioning: Custom
          version: ${{ steps.version.outputs.version }}
          androidSymbolType: public

      - name: Export universal APK from AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        # unity-builder가 컨테이너 안에서 root로 만든 폴더라 소유권을 가져와야 쓸 수 있음
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          bash Tools/export-universal-apk.sh build/Android/Android.aab build/Android/Android.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Build-Android
          path: |
            build/Android
            !build/Android/Android_BackUpThisFolder_ButDontShipItWithYourGame
          retention-days: 5

      # 실패한 빌드에 태그가 남지 않도록 마지막에 실행
      - name: Tag the release
        if: steps.version.outputs.create_tag == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"