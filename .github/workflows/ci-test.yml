name: CI / Test

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Tools/CoverageFilters.json'
  
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install paid assets
        run: |
          git clone https://x-access-token:${{ secrets.PAT_ASSET }}@github.com/${{ github.repository_owner }}/BounceOrBreak-Assets.git $HOME/paid-assets
          node Tools/install-paid-assets.js

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-Test-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Test-

      - name: Test Unity project
        uses: game-ci/unity-test-runner@v4.3.2
        id: testRunner
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.9f1
          testMode: EditMode
          coverageOptions: 'generateHtmlReport;generateAdditionalMetrics;filtersFromFile:Tools/CoverageFilters.json'

      - name: Guard against an empty test run
        run: |
          results="${{ steps.testRunner.outputs.artifactsPath }}/editmode-results.xml"

          if [ ! -f "$results" ]; then
            echo "::error::Test results not found at $results"
            exit 1
          fi

          count=$(python3 -c "import sys, xml.etree.ElementTree as ET; print(ET.parse(sys.argv[1]).getroot().get('testcasecount', '0'))" "$results")
          echo "EditMode test cases: $count" >> "$GITHUB_STEP_SUMMARY"

          if [ "$count" -eq 0 ]; then
            echo "::error::No EditMode tests were executed."
            exit 1
          fi

      - name: Guard against an unfiltered coverage run
        run: |
          summary="${{ steps.testRunner.outputs.coveragePath }}/Report/Summary.json"
          filters="Tools/CoverageFilters.json"

          if [ ! -f "$summary" ]; then
            echo "::error::Coverage summary not found at $summary"
            exit 1
          fi

          expected=$(python3 -c "import json, sys; print(len(json.load(open(sys.argv[1]))['assembliesInclude']))" "$filters")
          actual=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1]))['summary']['assemblies'])" "$summary")
          echo "Covered assemblies: $actual (expected $expected)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$actual" -ne "$expected" ]; then
            echo "::error::Coverage measured $actual assemblies but $filters lists $expected. The filter file was likely not applied."
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test-Results
          path: ${{ steps.testRunner.outputs.artifactsPath }}
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Coverage-Report
          path: ${{ steps.testRunner.outputs.coveragePath }}
          retention-days: 7
          if-no-files-found: warn